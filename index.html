<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>WiMi Wedding Invitation</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================
         MÀN HÌNH MỞ THIỆP
    ====================================== -->

    <div id="opening">

                YOU ARE INVITED

                WIMI<br>
                WEDDING

         NỘI DUNG THIỆP
    ====================================== -->

    <main id="wedding">


        <!-- VIDEO 01 -->

        <section class="wedding-section">

            <video
                class="wedding-video"
                src="videos/Video-01.mp4"
                muted
                playsinline
                preload="auto">
            </video>

        </section>

         NÚT NHẠC
    ====================================== -->

        id="musicButton"
        class="music-button"
        aria-label="Bật hoặc tắt nhạc">
